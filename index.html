<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レトロ喫茶 ログ</title>
  <style>
   body {
      background-color: #2b1e1a;
      color: #f4ecd8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    .app-container {
      width: 360px;
      background-color: #3d2b1f;
      border: 4px solid #8b5a2b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
    }
    /* ★ カウンター表示エリア（背景画像を縦長に大きく拡大） */
    .counter-area {
      height: 330px; /* 高さを200px → 330pxに拡大！ */
      background-image: url('picture/bg_image.webp'); /* 画像のパス */
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      border: 2px solid #8b5a2b;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .speech-bubble {
      background: #fff8e7;
      color: #333;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.3s;
      text-align: center;
      max-width: 85%;
      position: absolute;
      top: 15px;       /* 画面の上側に配置 */
      z-index: 3;      /* 重なり順：一番手前 */
    }

    /* 2. お客さん（テーブルの奥に配置） */
    .customer {
      font-size: 42px;
      opacity: 0;
      transition: opacity 0.5s;
      position: absolute;
      bottom: 20px;    /* テーブルのすぐ上に足を合わせる */
      z-index: 1;      /* 重なり順：奥 */
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

/* おじさん画像用のサイズ設定 */
    .customer-img {
      max-height: 260px; /* 画像の高さ（カウンターに合わせて調整OK） */
      width: auto;
    }
    .counter-table {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35px;    /* カウンターの厚みを少し拡大 */
      background-color: #3a2212;
      border-top: 3px solid #8b5a2b;
      z-index: 2;      /* 重なり順：おじさんより手前 */
    }

    /* ★ レジエリア（全体をコンパクトに縮小） */
    .register-area {
      background-color: #2b1e1a;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #8b5a2b;
    }
    .display-box {
      background-color: #c2c5a0;
      color: #1a1a1a;
      font-family: 'Courier New', monospace;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      border: 2px solid #555;
    }
    .display-total {
      font-size: 11px;
      color: #444;
      display: flex;
      justify-content: space-between;
    }
    .display-input {
      font-size: 18px;
      font-weight: bold;
      text-align: right;
    }
    .drink-select {
      width: 100%;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #8b5a2b;
      background: #f4ecd8;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .key-btn {
      padding: 6px; /* ボタンの高さを小さく */
      background-color: #5c3a21;
      color: #f4ecd8;
      border: 1px solid #8b5a2b;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 0 #2b1e1a;
    }
    .key-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .key-btn.clear {
      background-color: #8b3a3a;
    }
    .submit-btn {
      width: 100%;
      padding: 8px; /* ボタンの高さを小さく */
      background-color: #b85b35;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 0 #7a3a20;
    }
    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .reset-btn {
      margin-top: 4px;
      background: none;
      border: none;
      color: #8b5a2b;
      font-size: 10px;
      cursor: pointer;
      text-decoration: underline;
      width: 100%;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- カウンター（客席）画面 -->
  <div class="counter-area">
    <div id="bubble" class="speech-bubble">ふぅ、一息つきたいな</div>
    <div id="customer" class="customer">☕️🧔‍♂️</div>
    <div class="counter-table"></div>
  </div>

  <!-- レジ・電卓画面 -->
  <div class="register-area">
    <div class="display-box">
      <div class="display-total">
        <span>本日合計</span>
        <span><span id="total">0</span> 円</span>
      </div>
      <div class="display-input"><span id="input-val">0</span> 円</div>
    </div>

    <!-- ドリンク選択 -->
    <select id="drink" class="drink-select">
      <option value="ブレンドコーヒー">☕️ ブレンドコーヒー</option>
      <option value="アイスオレ">🥛 アイスオレ</option>
      <option value="クリームソーダ">🍹 クリームソーダ</option>
      <option value="紅茶">🫖 紅茶</option>
    </select>

    <!-- 電卓テンキー -->
    <div class="keypad">
      <button class="key-btn" onclick="pressNum('7')">7</button>
      <button class="key-btn" onclick="pressNum('8')">8</button>
      <button class="key-btn" onclick="pressNum('9')">9</button>
      <button class="key-btn" onclick="pressNum('4')">4</button>
      <button class="key-btn" onclick="pressNum('5')">5</button>
      <button class="key-btn" onclick="pressNum('6')">6</button>
      <button class="key-btn" onclick="pressNum('1')">1</button>
      <button class="key-btn" onclick="pressNum('2')">2</button>
      <button class="key-btn" onclick="pressNum('3')">3</button>
      <button class="key-btn clear" onclick="clearInput()">C</button>
      <button class="key-btn" onclick="pressNum('0')">0</button>
      <button class="key-btn" onclick="pressNum('00')">00</button>
    </div>

    <button class="submit-btn" onclick="processOrder()">🛎️ 帳簿に打刻する</button>
    <button class="reset-btn" onclick="resetTotal()">※本日の記録をリセット</button>
  </div>
</div>

<script>
  let currentInput = "0";
  let totalAmount = parseInt(localStorage.getItem('cafe_today_total')) || 0;

  // ★ タイマー管理変数は必ず「関数の外側」で宣言する
  let timer1 = null;
  let timer2 = null;

  // 初期化（保存データの表示）
  document.getElementById('total').textContent = totalAmount.toLocaleString();

// ★ ドアの「ガチャッ！」というメカニカルな音 ＋ 2つの重なる金属ベル音
  function playRegisterSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;

    // --- 【ドア・ラッチ部分（ガチャッ！）】 ---

    // 1-1. 「ガッ」：ラッチが触れる瞬間の高音カチャ音
    const buffer1 = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
    const data1 = buffer1.getChannelData(0);
    for (let i = 0; i < data1.length; i++) data1[i] = Math.random() * 2 - 1;
    
    const noise1 = audioCtx.createBufferSource();
    noise1.buffer = buffer1;
    const filter1 = audioCtx.createBiquadFilter();
    filter1.type = 'highpass';
    filter1.frequency.value = 2500; // カチッとした高い金属質感

    const gain1 = audioCtx.createGain();
    gain1.gain.setValueAtTime(0.5, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

    noise1.connect(filter1);
    filter1.connect(gain1);
    gain1.connect(audioCtx.destination);
    noise1.start(now);

    // 1-2. 「チャッ！」：ラッチが奥にハマる主音（0.025秒遅れて発音）
    const buffer2 = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.07, audioCtx.sampleRate);
    const data2 = buffer2.getChannelData(0);
    for (let i = 0; i < data2.length; i++) data2[i] = Math.random() * 2 - 1;

    const noise2 = audioCtx.createBufferSource();
    noise2.buffer = buffer2;
    const filter2 = audioCtx.createBiquadFilter();
    filter2.type = 'bandpass';
    filter2.frequency.value = 1600; // ドア枠に当たる硬い衝撃音

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.setValueAtTime(0.7, now + 0.025);
    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.07);

    noise2.connect(filter2);
    filter2.connect(gain2);
    gain2.connect(audioCtx.destination);
    noise2.start(now + 0.025);

    // 1-3. 扉が枠にハマる固いフレーム音（矩形波の短い打撃）
    const frameOsc = audioCtx.createOscillator();
    const frameGain = audioCtx.createGain();
    frameOsc.type = 'square';
    frameOsc.frequency.setValueAtTime(500, now + 0.02);
    frameOsc.frequency.exponentialRampToValueAtTime(120, now + 0.06);

    frameGain.gain.setValueAtTime(0, now);
    frameGain.gain.setValueAtTime(0.3, now + 0.02);
    frameGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);

    frameOsc.connect(frameGain);
    frameGain.connect(audioCtx.destination);
    frameOsc.start(now + 0.02);
    frameOsc.stop(now + 0.06);


    // --- 【ベル部分（２つの重なる余韻音）】 ---

    // 2-1. 【金属ベル音 ①】（1760Hz）
    const bell1 = audioCtx.createOscillator();
    const bell1Gain = audioCtx.createGain();
    bell1.type = 'sine';
    bell1.frequency.setValueAtTime(1760, now + 0.05);

    bell1Gain.gain.setValueAtTime(0, now);
    bell1Gain.gain.setValueAtTime(0.3, now + 0.05);
    bell1Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

    bell1.connect(bell1Gain);
    bell1Gain.connect(audioCtx.destination);
    bell1.start(now + 0.05);
    bell1.stop(now + 0.85);

    // 2-2. 【金属ベル音 ②】（2217Hz）
    const bell2 = audioCtx.createOscillator();
    const bell2Gain = audioCtx.createGain();
    bell2.type = 'sine';
    bell2.frequency.setValueAtTime(2217, now + 0.06);

    bell2Gain.gain.setValueAtTime(0, now);
    bell2Gain.gain.setValueAtTime(0.25, now + 0.06);
    bell2Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

    bell2.connect(bell2Gain);
    bell2Gain.connect(audioCtx.destination);
    bell2.start(now + 0.06);
    bell2.stop(now + 0.95);
  }

  // テンキー入力処理
  function pressNum(num) {
    if (currentInput === "0" && num !== "00") {
      currentInput = num;
    } else if (currentInput !== "0") {
      currentInput += num;
    }
    updateDisplay();
  }

  // 入力クリア
  function clearInput() {
    currentInput = "0";
    updateDisplay();
  }

  // 表示更新
  function updateDisplay() {
    document.getElementById('input-val').textContent = parseInt(currentInput).toLocaleString();
  }

  // 打刻処理
  function processOrder() {
    const price = parseInt(currentInput);
    if (price === 0) return;
    
    // ★ レジのチーン！音を再生
    playRegisterSound();

    const drink = document.getElementById('drink').value;
    const customer = document.getElementById('customer');
    const bubble = document.getElementById('bubble');
    const totalDisp = document.getElementById('total');

    // ★ 進行中のタイマーをリセット
    if (timer1) clearTimeout(timer1);
    if (timer2) clearTimeout(timer2);

    // 本日合計に加算してブラウザに保存
    totalAmount += price;
    localStorage.setItem('cafe_today_total', totalAmount);
    totalDisp.textContent = totalAmount.toLocaleString();

   // ドリンクに応じた画像をセットする
     let imageFile = "picture/man_coffee.png"; // デフォルト（ブレンドコーヒー）

     if (drink === "アイスオレ") {
       imageFile = "picture/woman_iced latte.png";      // ※実際のファイル名に合わせて調整してください
     } else if (drink === "クリームソーダ") {
       imageFile = "picture/man_creamsoda.png";     // ※実際のファイル名に合わせて調整してください
     } else if (drink === "紅茶") {
       imageFile = "picture/woman_tea.png";      // ※実際のファイル名に合わせて調整してください
     }

     customer.innerHTML = `<img src="${imageFile}" class="customer-img">`;

    // お客さんの演出表示
    customer.style.opacity = '1';
    bubble.style.opacity = '1';
    bubble.textContent = `${drink}（${price}円）ですね。いただきます！`;

    // お客さんの演出表示
    customer.style.opacity = '1';
    bubble.style.opacity = '1';
    bubble.textContent = `${drink}（${price}円）ですね　いただきます`;
    // 入力数値をリセット
    currentInput = "0";
    updateDisplay();

    // 新しいタイマーをセット
    timer1 = setTimeout(() => {
      bubble.textContent = "ごちそうさまでした";
    }, 2000);

    timer2 = setTimeout(() => {
      customer.style.opacity = '0';
      bubble.style.opacity = '0';
    }, 4500);
  }

  // リセット機能
  function resetTotal() {
    if (confirm("本日の合計金額をリセットしますか？")) {
      totalAmount = 0;
      localStorage.removeItem('cafe_today_total');
      document.getElementById('total').textContent = "0";
    }
  }
</script>

</body>
</html>
