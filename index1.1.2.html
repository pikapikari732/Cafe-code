<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レトロ喫茶 ログ</title>
  <style>
    body {
      background-color: #2b1e1a;
      color: #f4ecd8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app-container {
      width: 360px;
      background-color: #3d2b1f;
      border: 4px solid #8b5a2b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    /* カウンター表示エリア */
    .counter-area {
      height: 200px;
      background-color: #5c3a21;
      border-radius: 8px;
      border: 2px solid #8b5a2b;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .speech-bubble {
      background: #fff8e7;
      color: #333;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
      text-align: center;
      max-width: 80%;
    }
    .customer {
      font-size: 48px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .counter-table {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 24px;
      background-color: #3a2212;
      border-top: 3px solid #8b5a2b;
    }
    /* レジエリア */
    .register-area {
      background-color: #2b1e1a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #8b5a2b;
    }
    .display-box {
      background-color: #c2c5a0;
      color: #1a1a1a;
      font-family: 'Courier New', monospace;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      border: 2px solid #555;
    }
    .display-total {
      font-size: 12px;
      color: #444;
      display: flex;
      justify-content: space-between;
    }
    .display-input {
      font-size: 24px;
      font-weight: bold;
      text-align: right;
    }
    .drink-select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #8b5a2b;
      background: #f4ecd8;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .key-btn {
      padding: 12px;
      background-color: #5c3a21;
      color: #f4ecd8;
      border: 1px solid #8b5a2b;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 0 #2b1e1a;
    }
    .key-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .key-btn.clear {
      background-color: #8b3a3a;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #b85b35;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #7a3a20;
    }
    .submit-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .reset-btn {
      margin-top: 8px;
      background: none;
      border: none;
      color: #8b5a2b;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      width: 100%;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- カウンター（客席）画面 -->
  <div class="counter-area">
    <div id="bubble" class="speech-bubble">ふぅ、一息つきたいな</div>
    <div id="customer" class="customer">☕️🧔‍♂️</div>
    <div class="counter-table"></div>
  </div>

  <!-- レジ・電卓画面 -->
  <div class="register-area">
    <div class="display-box">
      <div class="display-total">
        <span>本日合計</span>
        <span><span id="total">0</span> 円</span>
      </div>
      <div class="display-input"><span id="input-val">0</span> 円</div>
    </div>

    <!-- ドリンク選択 -->
    <select id="drink" class="drink-select">
      <option value="ブレンドコーヒー">☕️ ブレンドコーヒー</option>
      <option value="アイスオレ">🥛 アイスオレ</option>
      <option value="クリームソーダ">🍹 クリームソーダ</option>
      <option value="紅茶">🫖 紅茶</option>
    </select>

    <!-- 電卓テンキー -->
    <div class="keypad">
      <button class="key-btn" onclick="pressNum('7')">7</button>
      <button class="key-btn" onclick="pressNum('8')">8</button>
      <button class="key-btn" onclick="pressNum('9')">9</button>
      <button class="key-btn" onclick="pressNum('4')">4</button>
      <button class="key-btn" onclick="pressNum('5')">5</button>
      <button class="key-btn" onclick="pressNum('6')">6</button>
      <button class="key-btn" onclick="pressNum('1')">1</button>
      <button class="key-btn" onclick="pressNum('2')">2</button>
      <button class="key-btn" onclick="pressNum('3')">3</button>
      <button class="key-btn clear" onclick="clearInput()">C</button>
      <button class="key-btn" onclick="pressNum('0')">0</button>
      <button class="key-btn" onclick="pressNum('00')">00</button>
    </div>

    <button class="submit-btn" onclick="processOrder()">🛎️ 帳簿に打刻する</button>
    <button class="reset-btn" onclick="resetTotal()">※本日の記録をリセット</button>
  </div>
</div>

<script>
  let currentInput = "0";
  let totalAmount = parseInt(localStorage.getItem('cafe_today_total')) || 0;

  // ★ タイマー管理変数は必ず「関数の外側」で宣言する
  let timer1 = null;
  let timer2 = null;

  // 初期化（保存データの表示）
  document.getElementById('total').textContent = totalAmount.toLocaleString();

  // テンキー入力処理
  function pressNum(num) {
    if (currentInput === "0" && num !== "00") {
      currentInput = num;
    } else if (currentInput !== "0") {
      currentInput += num;
    }
    updateDisplay();
  }

  // 入力クリア
  function clearInput() {
    currentInput = "0";
    updateDisplay();
  }

  // 表示更新
  function updateDisplay() {
    document.getElementById('input-val').textContent = parseInt(currentInput).toLocaleString();
  }

  // 打刻処理
  function processOrder() {
    const price = parseInt(currentInput);
    if (price === 0) return;

    const drink = document.getElementById('drink').value;
    const customer = document.getElementById('customer');
    const bubble = document.getElementById('bubble');
    const totalDisp = document.getElementById('total');

    // ★ 進行中のタイマーをリセット
    if (timer1) clearTimeout(timer1);
    if (timer2) clearTimeout(timer2);

    // 本日合計に加算してブラウザに保存
    totalAmount += price;
    localStorage.setItem('cafe_today_total', totalAmount);
    totalDisp.textContent = totalAmount.toLocaleString();

    // お客さんの演出表示
    customer.style.opacity = '1';
    bubble.style.opacity = '1';
    bubble.textContent = `${drink}（${price}円）ですね。いただきます！`;

    // 入力数値をリセット
    currentInput = "0";
    updateDisplay();

    // 新しいタイマーをセット
    timer1 = setTimeout(() => {
      bubble.textContent = "ごちそうさま。今日も一日がんばれます。";
    }, 2000);

    timer2 = setTimeout(() => {
      customer.style.opacity = '0';
      bubble.style.opacity = '0';
    }, 4500);
  }

  // リセット機能
  function resetTotal() {
    if (confirm("本日の合計金額をリセットしますか？")) {
      totalAmount = 0;
      localStorage.removeItem('cafe_today_total');
      document.getElementById('total').textContent = "0";
    }
  }
</script>

</body>
</html>
